services:
  nicevid:
    build: .
    ports:
      - "8080:8080"
    image: vidzap:latest
    container_name: vidzap
    environment:
      - NICEVID_DATA_DIR=/app/data
      - NICEVID_STORAGE_SECRET=change-me-to-a-random-string
      - NICEVID_RELOAD=false
      - NICEGUI_STORAGE_PATH=/app/data/.nicegui
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies
      - ./data:/app/data
    restart: unless-stopped
    # 资源限制：NAS 共享环境防止单容器拖垮整机
    #   memory 2G — Playwright Chromium 峰值 800MB + ffmpeg 200MB + Python 100MB 足够
    #   cpus 4    — yt-dlp/ffmpeg CPU 密集但不至于占满所有核心
    mem_limit: 2g
    cpus: "4"
